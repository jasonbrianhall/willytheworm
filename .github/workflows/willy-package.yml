name: Build and Release Willy the Worm (Python + Native C++)

on:
  push:
    branches:
      - main
      - dev
    paths:
      - '**.py'
      - '**.json'
      - '**.md'
      - '**.txt'
      - '**.yml'
      - '**.yaml'
      - 'audio/**'
      - 'cpp/**.cpp'
      - 'cpp/**.h'
      - 'cpp/CMakeLists.txt'
      - 'cpp/vcpkg.json'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - '**.py'
      - '**.json'
      - '**.md'
      - '**.txt'
      - '**.yml'
      - '**.yaml'
      - 'audio/**'
      - 'cpp/**.cpp'
      - 'cpp/**.h'
      - 'cpp/CMakeLists.txt'
      - 'cpp/vcpkg.json'
  workflow_dispatch:

env:
  PRODUCT_VERSION: "1.0.${{ github.run_number }}"
  UPGRADE_CODE_PYTHON: "D0A8E7F1-3B92-4C67-B8E5-1A4F26D95C03"
  UPGRADE_CODE_CPP: "F4C8B2E1-9D3A-4F6B-A1E5-7C2D8B4F9A3E"

jobs:
  create-source-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      version: ${{ env.PRODUCT_VERSION }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Create Source Archive
        run: |
          zip -r willy-the-worm-source.zip . -x '*.git*'
      
      - name: Upload Source Archive
        uses: actions/upload-artifact@v4
        with:
          name: source-package
          path: willy-the-worm-source.zip

  build-windows-installer:
    runs-on: windows-latest
    needs: create-source-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          pip install cx_Freeze
          pip install wheel setuptools

      - name: Create Runtime Hook
        run: |
          echo 'import os
          import sys
          os.environ["SDL_VIDEODRIVER"] = "windows"
          if getattr(sys, "frozen", False):
              os.chdir(os.path.dirname(sys.executable))' > rthooks.py
          
      - name: Create Windows Executables
        run: |
          pyinstaller --onefile --noconsole --icon=icon.ico --add-data "levels.json;." --add-data "original_levels.json;." --add-data "willy.chr;." --add-data "audio/*;audio/" --runtime-hook rthooks.py --collect-all pygame willy.py
          pyinstaller --onefile --noconsole --icon=edwilly.ico --add-data "levels.json;." --add-data "original_levels.json;." --add-data "willy.chr;." --add-data "audio/*;audio/" --runtime-hook rthooks.py --collect-all pygame edwilly.py
          pyinstaller --onefile --noconsole --icon=icon.ico --add-data "levels.json;." --add-data "original_levels.json;." --add-data "willy.chr;." --add-data "audio/*;audio/" --runtime-hook rthooks.py --collect-all pygame willy_qt.py

      - name: Prepare Build Artifacts
        run: |
          # Create build directory structure
          New-Item -ItemType Directory -Force -Path "build/windows"
          
          # Copy executables
          Copy-Item "dist/willy.exe" "build/windows/"
          Copy-Item "dist/edwilly.exe" "build/windows/"
          Copy-Item "dist/willy_qt.exe" "build/windows/"
          
          # Copy resources
          Copy-Item "README.md" "build/windows/"
          Copy-Item "LICENSE.md" "build/windows/"
          Copy-Item "contribution.md" "build/windows/"
          Copy-Item "wiki.md" "build/windows/"
          Copy-Item "levels.json" "build/windows/"
          Copy-Item "original_levels.json" "build/windows/"
          Copy-Item "willy.chr" "build/windows/"
          Copy-Item "icon.ico" "build/windows/"
          Copy-Item "edwilly.ico" "build/windows/"
          Copy-Item "icon.png" "build/windows/"
          Copy-Item "willy.py" "build/windows/"
          Copy-Item "edwilly.py" "build/windows/"
          Copy-Item "willy_qt.py" "build/windows/"
          Copy-Item "requirements.txt" "build/windows/"
          
          # Copy audio directory
          Copy-Item "audio" "build/windows/" -Recurse
          
          # Create portable ZIP
          Compress-Archive -Path "build/windows/*" -DestinationPath "WillyTheWorm-Portable.zip"

      - name: Install WiX Toolset
        run: |
          # Download and install WiX Toolset v3
          Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311-binaries.zip" -OutFile "wix.zip"
          Expand-Archive -Path "wix.zip" -DestinationPath "wix"
          echo "$env:GITHUB_WORKSPACE\wix" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Create MIT License File
        run: |
          @"
          MIT License
          
          Copyright (c) 2025 Jason Hall
          
          Permission is hereby granted, free of charge, to any person obtaining a copy
          of this software and associated documentation files (the "Software"), to deal
          in the Software without restriction, including without limitation the rights
          to use, copy, modify, merge, publish, distribute, sublicense, and/or sell
          copies of the Software, and to permit persons to whom the Software is
          furnished to do so, subject to the following conditions:
          
          The above copyright notice and this permission notice shall be included in all
          copies or substantial portions of the Software.
          
          THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR
          IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,
          FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE
          AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER
          LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,
          OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
          SOFTWARE.
          "@ | Out-File -FilePath "build\windows\LICENSE.txt" -Encoding UTF8

      - name: Generate Advanced MSI Installer
        working-directory: build/windows
        run: |
          # Create advanced WXS installer
          @"
          <?xml version="1.0" encoding="UTF-8"?>
          <Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">
            
            <Product Id="*" 
                     Name="Willy the Worm" 
                     Language="1033" 
                     Version="${{ needs.create-source-release.outputs.version }}" 
                     Manufacturer="Jason Hall" 
                     UpgradeCode="${{ env.UPGRADE_CODE_PYTHON }}"> 
              
              <Package InstallerVersion="500" 
                       Compressed="yes" 
                       InstallScope="perMachine" 
                       Description="Willy the Worm - Classic Platform Game Collection"
                       Comments="Built with GitHub Actions"
                       Manufacturer="Jason Hall" />
              
              <!-- Major upgrade configuration -->
              <MajorUpgrade 
                DowngradeErrorMessage="A newer version of Willy the Worm is already installed. Please uninstall it first." 
                Schedule="afterInstallInitialize" />
              
              <MediaTemplate EmbedCab="yes" CompressionLevel="high" />
              
              <!-- License agreement -->
              <WixVariable Id="WixUILicenseRtf" Value="License.rtf" />
              
              <!-- Custom properties -->
              <Property Id="ARPPRODUCTICON" Value="WillyIcon" />
              <Property Id="ARPURLINFOABOUT" Value="https://github.com/yourusername/willy-the-worm" />
              <Property Id="ARPNOREPAIR" Value="yes" />
              <Property Id="ARPNOMODIFY" Value="yes" />
              <Property Id="ARPHELPLINK" Value="https://github.com/yourusername/willy-the-worm/issues" />
              
              <!-- Installation scope choice -->
              <Property Id="ApplicationFolderName" Value="Willy the Worm" />
              <Property Id="WixAppFolder" Value="WixPerMachineFolder" />
              <WixVariable Id="WixUISupportPerUser" Value="1" />
              <WixVariable Id="WixUISupportPerMachine" Value="1" />
              
              <Directory Id="TARGETDIR" Name="SourceDir">
                <!-- Program Files installation -->
                <Directory Id="ProgramFilesFolder">
                  <Directory Id="INSTALLFOLDER" Name="!(bind.Property.ApplicationFolderName)">
                    
                    <!-- Main application component -->
                    <Component Id="MainExecutable" 
                             Guid="E2A49E3F-B0A4-45D9-8923-A4A6D3EA2944"
                             Win64="no">
                      <File Id="WillyEXE" 
                            Name="willy.exe" 
                            Source="willy.exe" 
                            KeyPath="yes">
                      </File>
                      
                      <!-- Game executables -->
                      <File Id="EdWillyEXE" Name="edwilly.exe" Source="edwilly.exe"/>
                      <File Id="WillyQtEXE" Name="willy_qt.exe" Source="willy_qt.exe"/>
                      
                      <!-- Application files -->
                      <File Id="README" Name="README.md" Source="README.md"/>
                      <File Id="LICENSE_MD" Name="LICENSE.md" Source="LICENSE.md"/>
                      <File Id="LICENSE_TXT" Name="LICENSE.txt" Source="LICENSE.txt"/>
                      <File Id="CONTRIBUTION" Name="contribution.md" Source="contribution.md"/>
                      <File Id="WIKI" Name="wiki.md" Source="wiki.md"/>
                      <File Id="Levels" Name="levels.json" Source="levels.json"/>
                      <File Id="OriginalLevels" Name="original_levels.json" Source="original_levels.json"/>
                      <File Id="Characters" Name="willy.chr" Source="willy.chr"/>
                      <File Id="IconICO" Name="icon.ico" Source="icon.ico"/>
                      <File Id="EdWillyIconICO" Name="edwilly.ico" Source="edwilly.ico"/>
                      <File Id="IconPNG" Name="icon.png" Source="icon.png"/>
                      <File Id="WillyPY" Name="willy.py" Source="willy.py"/>
                      <File Id="EdWillyPY" Name="edwilly.py" Source="edwilly.py"/>
                      <File Id="WillyQtPY" Name="willy_qt.py" Source="willy_qt.py"/>
                      <File Id="Requirements" Name="requirements.txt" Source="requirements.txt"/>
                      
                      <!-- Registry entries for uninstall info -->
                      <RegistryKey Root="HKLM" Key="SOFTWARE\Willy the Worm">
                        <RegistryValue Type="string" Name="InstallPath" Value="[INSTALLFOLDER]" />
                        <RegistryValue Type="string" Name="Version" Value="${{ needs.create-source-release.outputs.version }}" />
                        <RegistryValue Type="string" Name="Publisher" Value="Jason Hall" />
                      </RegistryKey>
                    </Component>
                    
                    <!-- Audio files component -->
                    <Directory Id="AudioDir" Name="audio">
                      <Component Id="AudioFiles" Guid="7B9DD5C8-2C1E-4B7F-9D47-F5A4D653809C">
                        <File Id="Bell" Name="bell.mp3" Source="audio/bell.mp3" />
                        <File Id="Boop" Name="boop.mp3" Source="audio/boop.mp3" />
                        <File Id="Jump" Name="jump.mp3" Source="audio/jump.mp3" />
                        <File Id="Ladder" Name="ladder.mp3" Source="audio/ladder.mp3" />
                        <File Id="Present" Name="present.mp3" Source="audio/present.mp3" />
                        <File Id="Tack" Name="tack.mp3" Source="audio/tack.mp3" />
                        <RemoveFolder Id="RemoveAudioDir" On="uninstall" />
                        <RegistryValue Root="HKCU" Key="Software\WillyTheWorm\Components" 
                                     Type="integer" Name="Audio" Value="1" KeyPath="yes"/>
                      </Component>
                    </Directory>
                  </Directory>
                </Directory>
                
                <!-- Start Menu shortcuts -->
                <Directory Id="ProgramMenuFolder">
                  <Directory Id="ApplicationProgramsFolder" Name="Willy the Worm">
                    <Component Id="ApplicationShortcuts" Guid="F8A427D5-9EE6-4B85-A543-E2B8C5D478B1">
                      <Shortcut Id="WillyStartMenu" 
                               Name="Willy the Worm" 
                               Target="[INSTALLFOLDER]willy.exe" 
                               WorkingDirectory="INSTALLFOLDER"
                               Description="Play Willy the Worm Platform Game"
                               Icon="WillyIcon"/>
                      <Shortcut Id="EdWillyStartMenu" 
                               Name="Willy Level Editor" 
                               Target="[INSTALLFOLDER]edwilly.exe" 
                               WorkingDirectory="INSTALLFOLDER"
                               Description="Create and Edit Willy the Worm Levels"
                               Icon="EdWillyIcon"/>
                      <Shortcut Id="WillyControlPanel" 
                               Name="Willy Control Panel" 
                               Target="[INSTALLFOLDER]willy_qt.exe" 
                               WorkingDirectory="INSTALLFOLDER"
                               Description="Willy the Worm Game Settings"
                               Icon="WillyQtIcon"/>
                      <Shortcut Id="UninstallShortcut"
                               Name="Uninstall Willy the Worm"
                               Target="[SystemFolder]msiexec.exe"
                               Arguments="/x [ProductCode]"
                               Description="Uninstall Willy the Worm" />
                      <RemoveFolder Id="ApplicationProgramsFolder" On="uninstall"/>
                      <RegistryValue Root="HKCU" Key="Software\WillyTheWorm\Shortcuts" 
                                   Name="StartMenu" Type="integer" Value="1" KeyPath="yes"/>
                    </Component>
                  </Directory>
                </Directory>
                
                <!-- Desktop shortcuts (optional) -->
                <Directory Id="DesktopFolder" Name="Desktop">
                  <Component Id="WillyDesktopShortcut" Guid="A8B9C2D3-E4F5-6789-A012-B3C4D5E6F789">
                    <Condition>DESKTOP_SHORTCUT</Condition>
                    <Shortcut Id="WillyDesktopShortcut" 
                             Name="Willy the Worm" 
                             Target="[INSTALLFOLDER]willy.exe"
                             WorkingDirectory="INSTALLFOLDER"
                             Description="Play Willy the Worm Platform Game"
                             Icon="WillyIcon"/>
                    <RegistryValue Root="HKCU" Key="Software\WillyTheWorm\Shortcuts" 
                                 Name="WillyDesktop" Type="integer" Value="1" KeyPath="yes"/>
                  </Component>
                  
                  <Component Id="EditorDesktopShortcut" Guid="B9C0D1E2-F3A4-5678-9012-C3D4E5F6A789">
                    <Condition>DESKTOP_SHORTCUT</Condition>
                    <Shortcut Id="EditorDesktopShortcut" 
                             Name="Willy Level Editor" 
                             Target="[INSTALLFOLDER]edwilly.exe"
                             WorkingDirectory="INSTALLFOLDER"
                             Description="Create and Edit Willy the Worm Levels"
                             Icon="EdWillyIcon"/>
                    <RegistryValue Root="HKCU" Key="Software\WillyTheWorm\Shortcuts" 
                                 Name="EditorDesktop" Type="integer" Value="1" KeyPath="yes"/>
                  </Component>
                  
                  <Component Id="ControlPanelDesktopShortcut" Guid="C0D1E2F3-A4B5-6789-0123-D4E5F6A7B890">
                    <Condition>DESKTOP_SHORTCUT</Condition>
                    <Shortcut Id="ControlPanelDesktopShortcut" 
                             Name="Willy Control Panel" 
                             Target="[INSTALLFOLDER]willy_qt.exe"
                             WorkingDirectory="INSTALLFOLDER"
                             Description="Willy the Worm Game Settings"
                             Icon="WillyQtIcon"/>
                    <RegistryValue Root="HKCU" Key="Software\WillyTheWorm\Shortcuts" 
                                 Name="ControlPanelDesktop" Type="integer" Value="1" KeyPath="yes"/>
                  </Component>
                </Directory>
              </Directory>
              
              <!-- Feature definitions -->
              <Feature Id="ProductFeature" 
                       Title="Willy the Worm" 
                       Description="Classic platform game with level editor and control panel."
                       Level="1" 
                       ConfigurableDirectory="INSTALLFOLDER"
                       AllowAdvertise="no">
                <ComponentRef Id="MainExecutable" />
                <ComponentRef Id="AudioFiles" />
                <ComponentRef Id="ApplicationShortcuts" />
              </Feature>
              
              <Feature Id="DesktopShortcutFeature" 
                       Title="Desktop Shortcuts" 
                       Description="Create shortcuts on the desktop for game, editor, and control panel."
                       Level="1000">
                <ComponentRef Id="WillyDesktopShortcut" />
                <ComponentRef Id="EditorDesktopShortcut" />
                <ComponentRef Id="ControlPanelDesktopShortcut" />
              </Feature>
              
              <!-- Application icons -->
              <Icon Id="WillyIcon" SourceFile="icon.ico"/>
              <Icon Id="EdWillyIcon" SourceFile="edwilly.ico"/>
              <Icon Id="WillyQtIcon" SourceFile="icon.ico"/>
              
              <!-- Custom actions for cleanup -->
              <CustomAction Id="CleanupRegistryOnUninstall" 
                           Script="vbscript"
                           Execute="deferred"
                           Impersonate="no">
                <![CDATA[
                  On Error Resume Next
                  Set shell = CreateObject("WScript.Shell")
                  shell.RegDelete "HKLM\SOFTWARE\Willy the Worm\"
                  shell.RegDelete "HKCU\Software\WillyTheWorm\"
                ]]>
              </CustomAction>
              
              <InstallExecuteSequence>
                <Custom Action="CleanupRegistryOnUninstall" Before="RemoveFiles">
                  REMOVE="ALL"
                </Custom>
              </InstallExecuteSequence>
              
              <!-- UI Configuration -->
              <Property Id="WIXUI_INSTALLDIR" Value="INSTALLFOLDER" />
              <Property Id="DESKTOP_SHORTCUT" Value="1" />
              
              <UIRef Id="WixUI_FeatureTree" />
              <UIRef Id="WixUI_ErrorProgressText" />
              
            </Product>
          </Wix>
          "@ | Out-File -FilePath "installer.wxs" -Encoding UTF8

      - name: Create License RTF for Installer
        working-directory: build/windows
        run: |
          @"
          {\rtf1\ansi\deff0 {\fonttbl {\f0 Times New Roman;}}
          \f0\fs24
          MIT License\par
          \par
          Copyright (c) 2025 Jason Hall\par
          \par
          Permission is hereby granted, free of charge, to any person obtaining a copy of this software and associated documentation files (the "Software"), to deal in the Software without restriction, including without limitation the rights to use, copy, modify, merge, publish, distribute, sublicense, and/or sell copies of the Software, and to permit persons to whom the Software is furnished to do so, subject to the following conditions:\par
          \par
          The above copyright notice and this permission notice shall be included in all copies or substantial portions of the Software.\par
          \par
          THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY, FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM, OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE SOFTWARE.\par
          }
          "@ | Out-File -FilePath "License.rtf" -Encoding UTF8

      - name: Build MSI Installer
        working-directory: build/windows
        run: |
          # Debug: Show current directory and files
          Write-Host "=== DEBUG: Current directory ==="
          Get-Location
          Write-Host "=== DEBUG: Files in current directory ==="
          Get-ChildItem
          
          # Compile the installer
          Write-Host "=== Building MSI installer ==="
          & candle.exe installer.wxs
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Candle compilation failed with exit code $LASTEXITCODE"
            exit 1
          }
          
          Write-Host "=== DEBUG: Files after candle ==="
          Get-ChildItem
          
          & light.exe -ext WixUIExtension installer.wixobj -o "WillyTheWorm.msi"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Light linking failed with exit code $LASTEXITCODE"
            exit 1
          }
          
          Write-Host "=== DEBUG: Files after light ==="
          Get-ChildItem
          
          # Verify MSI was created
          if (Test-Path "WillyTheWorm.msi") {
            Write-Host "✅ MSI installer created successfully: WillyTheWorm.msi"
            $msiSize = (Get-Item "WillyTheWorm.msi").Length
            Write-Host "MSI file size: $msiSize bytes"
          } else {
            Write-Error "❌ MSI file was not created!"
            exit 1
          }

      - name: Upload MSI Installer
        uses: actions/upload-artifact@v4
        with:
          name: WillyTheWorm.msi
          path: build/windows/WillyTheWorm.msi

      - name: Upload Portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: WillyTheWorm-Portable.zip
          path: WillyTheWorm-Portable.zip

  build-windows:
    runs-on: windows-latest
    outputs:
      version: ${{ env.PRODUCT_VERSION }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            cmake_arch: x64
            triplet: x64-windows
          - name: arm64
            cmake_arch: ARM64
            triplet: arm64-windows

    steps:
    - uses: actions/checkout@v4

    - name: Bootstrap vcpkg
      run: |
        git clone --branch 2026.07.29 --depth 1 https://github.com/microsoft/vcpkg.git C:\vcpkg
        C:\vcpkg\bootstrap-vcpkg.bat
        echo "VCPKG_ROOT=C:\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "VCPKG_BINARY_SOURCES=clear;files,C:\vcpkg_bincache,readwrite" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Restore vcpkg binary cache
      uses: actions/cache/restore@v4
      with:
        path: C:\vcpkg_bincache
        key: vcpkg-bincache-willy-${{ matrix.triplet }}-${{ hashFiles('cpp/vcpkg.json') }}
        restore-keys: |
          vcpkg-bincache-willy-${{ matrix.triplet }}-

    - name: Install Dependencies (vcpkg)
      working-directory: cpp
      run: |
        C:\vcpkg\vcpkg.exe install --triplet ${{ matrix.triplet }} --x-install-root=C:\vcpkg\installed

    - name: Save vcpkg binary cache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: C:\vcpkg_bincache
        key: vcpkg-bincache-willy-${{ matrix.triplet }}-${{ hashFiles('cpp/vcpkg.json') }}

    - name: Configure (CMake, MSVC)
      run: |
        cmake -S cpp -B build -A ${{ matrix.cmake_arch }} -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} -DVCPKG_INSTALLED_DIR=C:\vcpkg\installed -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: |
        cmake --build build --config Release --parallel

    - name: Convert PNG Icon to ICO Format
      working-directory: build\Release
      run: |
        if (Test-Path "..\..\icon.png") {
          magick "..\..\icon.png" -resize 256x256 -colors 256 icon.ico
          Write-Host "Icon converted successfully"
        } else {
          Write-Host "icon.png not found at repo root"
        }

    - name: Prepare Build Artifacts
      working-directory: build\Release
      run: |
        Copy-Item ..\..\README.md . -ErrorAction SilentlyContinue
        Copy-Item ..\..\LICENSE.md . -ErrorAction SilentlyContinue
        Copy-Item ..\..\icon.png . -ErrorAction SilentlyContinue
        Copy-Item ..\..\levels.json . -ErrorAction SilentlyContinue
        Copy-Item ..\..\original_levels.json . -ErrorAction SilentlyContinue
        Copy-Item ..\..\willy.chr . -ErrorAction SilentlyContinue
        Copy-Item ..\..\audio -Destination . -Recurse -ErrorAction SilentlyContinue

        if (-not (Test-Path "willy.exe")) {
          Write-Error "willy.exe not found!"; exit 1
        }
        Write-Host "willy.exe found"

        Copy-Item "C:\vcpkg\installed\${{ matrix.triplet }}\bin\*.dll" . -ErrorAction SilentlyContinue

        Write-Host "Portable package contents:"
        Get-ChildItem *.exe, *.dll | Format-Table Name, Length

        Compress-Archive -Path * -DestinationPath ..\..\WillyTheWorm-CPP-Portable-${{ matrix.name }}.zip -Force

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: willy-cpp-build-${{ matrix.name }}
        path: WillyTheWorm-CPP-Portable-${{ matrix.name }}.zip
        retention-days: 7

  build-debug-standalone:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Bootstrap vcpkg
      run: |
        git clone --branch 2026.07.29 --depth 1 https://github.com/microsoft/vcpkg.git C:\vcpkg
        C:\vcpkg\bootstrap-vcpkg.bat
        echo "VCPKG_ROOT=C:\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "VCPKG_BINARY_SOURCES=clear;files,C:\vcpkg_bincache,readwrite" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Restore vcpkg binary cache
      uses: actions/cache/restore@v4
      with:
        path: C:\vcpkg_bincache
        key: vcpkg-bincache-willy-x64-windows-${{ hashFiles('cpp/vcpkg.json') }}
        restore-keys: |
          vcpkg-bincache-willy-x64-windows-

    - name: Install Dependencies (vcpkg)
      working-directory: cpp
      run: |
        C:\vcpkg\vcpkg.exe install --triplet x64-windows --x-install-root=C:\vcpkg\installed

    - name: Save vcpkg binary cache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: C:\vcpkg_bincache
        key: vcpkg-bincache-willy-x64-windows-${{ hashFiles('cpp/vcpkg.json') }}

    - name: Configure (CMake, MSVC, Debug + ASan)
      run: |
        cmake -S cpp -B build-debug -A x64 -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows -DVCPKG_INSTALLED_DIR=C:\vcpkg\installed -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="/fsanitize=address" -DCMAKE_C_FLAGS="/fsanitize=address"

    - name: Build (Debug)
      run: |
        cmake --build build-debug --config Debug --parallel

    - name: Stage Debug Artifacts
      working-directory: build-debug\Debug
      run: |
        Copy-Item "C:\vcpkg\installed\x64-windows\debug\bin\*.dll" . -ErrorAction SilentlyContinue
        Copy-Item "C:\vcpkg\installed\x64-windows\bin\*.dll" . -ErrorAction SilentlyContinue

        # Debug CRT (VCRUNTIME140D.dll, msvcp140d.dll, ucrtbased.dll, vcruntime140_1d.dll)
        # isn't redistributable, so grab it straight from the VS Build Tools on this runner.
        $debugCrtDir = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Recurse -Directory -Filter "Microsoft.VC*.DebugCRT" -ErrorAction SilentlyContinue |
                       Where-Object { $_.FullName -match '\\x64\\' } |
                       Select-Object -First 1
        if ($debugCrtDir) {
          Write-Host "Found Debug CRT at $($debugCrtDir.FullName)"
          Copy-Item "$($debugCrtDir.FullName)\*.dll" . -Force
        } else {
          Write-Warning "Debug CRT redist folder not found on this runner image -- VCRUNTIME140D.dll etc. will be missing from the zip."
        }

        # ASan (/fsanitize=address) needs its runtime DLL next to the exe.
        $asanDll = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter "clang_rt.asan_dynamic-x86_64.dll" -ErrorAction SilentlyContinue |
                   Where-Object { $_.FullName -match '\\Hostx64\\x64\\' } |
                   Select-Object -First 1
        if ($asanDll) {
          Write-Host "Found ASan runtime at $($asanDll.FullName)"
          Copy-Item $asanDll.FullName . -Force
        } else {
          Write-Warning "ASan runtime DLL not found -- instrumented exe likely won't launch."
        }

        Get-ChildItem *.exe, *.pdb, *.dll | Format-Table Name, Length
        Compress-Archive -Path *.exe, *.pdb, *.dll -DestinationPath ..\..\WillyTheWorm-CPP-Debug-x64.zip -Force

    - name: Upload Debug Build
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: willy-cpp-debug-x64
        path: WillyTheWorm-CPP-Debug-x64.zip
        retention-days: 7

  build-msi-windows:
    # WiX v3 has no ARM64 target support, so the MSI stays x64-only.
    needs: build-windows
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Download Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: willy-cpp-build-x64
        path: .

    - name: Extract Build Files
      run: |
        Expand-Archive -Path "WillyTheWorm-CPP-Portable-x64.zip" -DestinationPath "artifacts/build/windows/" -Force

    - name: Setup WiX Toolset
      run: |
        Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311-binaries.zip" -OutFile "wix.zip"
        Expand-Archive -Path "wix.zip" -DestinationPath "wix"
        echo "$env:GITHUB_WORKSPACE\wix" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Generate MSI Installer
      working-directory: artifacts/build/windows
      run: |
        $version = "${{ env.PRODUCT_VERSION }}"
        $upgradeCode = "${{ env.UPGRADE_CODE_CPP }}"

        # Every top-level file except the exe and the MSI-only icon.ico
        # (README, LICENSE, icon.png, DLLs, levels.json, willy.chr, ...)
        $otherFiles = Get-ChildItem -File | Where-Object { $_.Name -notin @("willy.exe", "icon.ico") }
        $fileEntries = $otherFiles | ForEach-Object {
          $safeId = $_.Name -replace '[^a-zA-Z0-9]', '_'
          "                <File Id=`"$safeId`" Name=`"$($_.Name)`" Source=`"$($_.Name)`"/>"
        }

        $audioEntries = @()
        if (Test-Path "audio") {
          $audioEntries = Get-ChildItem "audio" -File | ForEach-Object {
            $safeId = "audio_" + ($_.Name -replace '[^a-zA-Z0-9]', '_')
            "                  <File Id=`"$safeId`" Name=`"$($_.Name)`" Source=`"audio\$($_.Name)`"/>"
          }
        }

        @"
        <?xml version="1.0" encoding="UTF-8"?>
        <Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">

          <Product Id="*"
                   Name="Willy the Worm"
                   Language="1033"
                   Version="$version"
                   Manufacturer="Jason Hall"
                   UpgradeCode="$upgradeCode">

            <Package InstallerVersion="500" Compressed="yes" InstallScope="perMachine"
                     Description="Willy the Worm - Native C++ Edition"
                     Manufacturer="Jason Hall" />

            <MajorUpgrade DowngradeErrorMessage="A newer version of Willy the Worm is already installed."
                          Schedule="afterInstallInitialize" />
            <MediaTemplate EmbedCab="yes" CompressionLevel="high" />

            <Icon Id="WillyIcon" SourceFile="icon.ico" />
            <Property Id="ARPPRODUCTICON" Value="WillyIcon" />
            <Property Id="ARPHELPLINK" Value="https://github.com/yourusername/willy-the-worm" />
            <Property Id="ARPURLINFOABOUT" Value="https://github.com/yourusername/willy-the-worm" />
            <Property Id="ARPCOMMENTS" Value="Native C++ port of Willy the Worm" />

            <WixVariable Id="WixUILicenseRtf" Value="License.rtf" />
            <Property Id="WIXUI_INSTALLDIR" Value="INSTALLFOLDER" />
            <Property Id="DESKTOP_SHORTCUT" Value="1" />

            <Directory Id="TARGETDIR" Name="SourceDir">
              <Directory Id="ProgramFiles64Folder">
                <Directory Id="INSTALLFOLDER" Name="Willy the Worm">
                  <Directory Id="AudioFolder" Name="audio" />
                </Directory>
              </Directory>
              <Directory Id="ProgramMenuFolder">
                <Directory Id="ApplicationProgramsFolder" Name="Willy the Worm" />
              </Directory>
              <Directory Id="DesktopFolder" />
            </Directory>

            <DirectoryRef Id="INSTALLFOLDER">
              <Component Id="MainExecutable" Guid="FF071EC7-3745-40E0-8C9C-404979903504" Win64="yes">
                <File Id="willy_exe" Name="willy.exe" Source="willy.exe" />

                <Shortcut Id="StartMenuShortcut"
                          Directory="ApplicationProgramsFolder"
                          Name="Willy the Worm"
                          Description="Willy the Worm - Native C++ Edition"
                          Target="[INSTALLFOLDER]willy.exe"
                          WorkingDirectory="INSTALLFOLDER"
                          Icon="WillyIcon"
                          IconIndex="0" />

                <RegistryValue Root="HKCU" Key="Software\WillyTheWormCPP" Name="installed"
                               Type="integer" Value="1" KeyPath="yes" />
                $($fileEntries -join "`r`n")
              </Component>
            </DirectoryRef>

            <DirectoryRef Id="AudioFolder">
              <Component Id="AudioFiles" Guid="379B70EB-279B-4CBD-9B7C-D9127BD0F873" Win64="yes">
                $($audioEntries -join "`r`n")
                <RegistryValue Root="HKCU" Key="Software\WillyTheWormCPP\Audio" Name="installed"
                               Type="integer" Value="1" KeyPath="yes" />
              </Component>
            </DirectoryRef>

            <DirectoryRef Id="ApplicationProgramsFolder">
              <Component Id="StartMenuFolder" Guid="4F2D2907-3CBF-479D-8CC9-8E08820958BD" Win64="yes">
                <RemoveFolder Id="ApplicationProgramsFolderRemove" On="uninstall" />
                <RegistryValue Root="HKCU" Key="Software\WillyTheWormCPP\Shortcuts" Name="StartMenu"
                               Type="integer" Value="1" KeyPath="yes" />
              </Component>
            </DirectoryRef>

            <DirectoryRef Id="DesktopFolder">
              <Component Id="DesktopShortcut" Guid="F244BC2C-2506-4FBA-B79C-6240078A524C" Win64="yes">
                <Condition>DESKTOP_SHORTCUT=1</Condition>
                <Shortcut Id="DesktopShortcutMain"
                          Directory="DesktopFolder"
                          Name="Willy the Worm"
                          Description="Willy the Worm - Native C++ Edition"
                          Target="[INSTALLFOLDER]willy.exe"
                          WorkingDirectory="INSTALLFOLDER"
                          Icon="WillyIcon"
                          IconIndex="0" />

                <RegistryValue Root="HKCU" Key="Software\WillyTheWormCPP\Shortcuts" Name="Desktop"
                               Type="integer" Value="1" KeyPath="yes" />
              </Component>
            </DirectoryRef>

            <Feature Id="MainFeature" Title="Willy the Worm" Level="1">
              <ComponentRef Id="MainExecutable" />
              <ComponentRef Id="AudioFiles" />
              <ComponentRef Id="StartMenuFolder" />
              <ComponentRef Id="DesktopShortcut" />
            </Feature>

            <UIRef Id="WixUI_InstallDir" />
            <UIRef Id="WixUI_ErrorProgressText" />

            <InstallExecuteSequence>
              <Custom Action="SetARPINSTALLLOCATION" After="InstallValidate" />
            </InstallExecuteSequence>
            <CustomAction Id="SetARPINSTALLLOCATION" Property="ARPINSTALLLOCATION" Value="[INSTALLFOLDER]" />

          </Product>
        </Wix>
        "@ | Out-File -FilePath "willy.wxs" -Encoding UTF8

        if (-not (Test-Path "License.rtf")) {
          @"
        {\rtf1\ansi\ansicpg1252
        {\colortbl;\red255\green255\blue255;}
        \margl1440\margr1440\vieww11900\viewh8605\viewkind0
        \pard\tx720\tx1440\tx2160\tx2880\tx3600\tx4320\pardirnatural\partightenfactor0
        \f0\fs20 \cf0 MIT License\
        \
        Copyright (c) 2025 Jason Hall\
        \
        Permission is hereby granted, free of charge, to any person obtaining a copy of this software and associated documentation files (the "Software"), to deal in the Software without restriction, including without limitation the rights to use, copy, modify, merge, publish, distribute, sublicense, and/or sell copies of the Software, and to permit persons to whom the Software is furnished to do so, subject to the following conditions:\
        \
        The above copyright notice and this permission notice shall be included in all copies or substantial portions of the Software.\
        \
        THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY, FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM, OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE SOFTWARE.}
        "@ | Out-File -FilePath "License.rtf" -Encoding ASCII
        }

        Write-Host "Compiling WXS..."
        & candle.exe -out "willy.wixobj" -arch x64 "willy.wxs"
        if ($LASTEXITCODE -ne 0) { Write-Error "Candle failed"; exit 1 }

        Write-Host "Linking MSI..."
        & light.exe -out "WillyTheWorm-CPP.msi" -ext WixUIExtension -ext WixUtilExtension "willy.wixobj"
        if ($LASTEXITCODE -ne 0) { Write-Error "Light failed"; exit 1 }

        if (Test-Path "WillyTheWorm-CPP.msi") {
          Write-Host "✅ MSI created: WillyTheWorm-CPP.msi ($((Get-Item 'WillyTheWorm-CPP.msi').Length) bytes)"
        } else {
          Write-Error "❌ MSI not created"; exit 1
        }

    - name: Upload MSI
      uses: actions/upload-artifact@v4
      with:
        name: WillyTheWorm-CPP.msi
        path: artifacts/build/windows/WillyTheWorm-CPP.msi
        retention-days: 7

  build-msix-windows:
    needs: build-windows
    runs-on: windows-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            processor_architecture: x64
          - name: arm64
            processor_architecture: arm64

    steps:
    - uses: actions/checkout@v4

    - name: Download Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: willy-cpp-build-${{ matrix.name }}
        path: .

    - name: Extract Build Files
      run: |
        Expand-Archive -Path "WillyTheWorm-CPP-Portable-${{ matrix.name }}.zip" -DestinationPath "msix-source\" -Force

    - name: Prepare MSIX Package Structure
      run: |
        New-Item -ItemType Directory -Force -Path "msix-package/Assets"
        New-Item -ItemType Directory -Force -Path "msix-package/Files"

        Copy-Item "msix-source/*" -Destination "msix-package/Files/" -Recurse -Force

        if (-not (Test-Path "msix-package/Files/willy.exe")) {
          Write-Error "willy.exe not found in package!"
          exit 1
        }

        Write-Host "✅ willy.exe verified in MSIX package"
        Write-Host "📦 MSIX Files directory contents:"
        Get-ChildItem "msix-package/Files/" -File | ForEach-Object {
          $size = "{0:N0}" -f $_.Length
          Write-Host "  - $($_.Name) ($size bytes)"
        }

    - name: Create MSIX Store Compliant Assets
      run: |
        $iconPath = "msix-source/icon.png"

        if (-not (Test-Path $iconPath)) {
          Write-Error "icon.png not found - cannot create Store assets"
          exit 1
        }

        Write-Host "Creating Microsoft Store compliant assets..."

        & magick "$iconPath" -resize 50x50   "msix-package/Assets/StoreLogo.scale-100.png"
        & magick "$iconPath" -resize 63x63   "msix-package/Assets/StoreLogo.scale-125.png"
        & magick "$iconPath" -resize 75x75   "msix-package/Assets/StoreLogo.scale-150.png"
        & magick "$iconPath" -resize 100x100 "msix-package/Assets/StoreLogo.scale-200.png"

        & magick "$iconPath" -resize 44x44 "msix-package/Assets/Willy44x44.scale-100.png"
        & magick "$iconPath" -resize 55x55 "msix-package/Assets/Willy44x44.scale-125.png"
        & magick "$iconPath" -resize 66x66 "msix-package/Assets/Willy44x44.scale-150.png"
        & magick "$iconPath" -resize 88x88 "msix-package/Assets/Willy44x44.scale-200.png"

        & magick "$iconPath" -resize 150x150 "msix-package/Assets/WillyLogo.scale-100.png"
        & magick "$iconPath" -resize 188x188 "msix-package/Assets/WillyLogo.scale-125.png"
        & magick "$iconPath" -resize 225x225 "msix-package/Assets/WillyLogo.scale-150.png"
        & magick "$iconPath" -resize 300x300 "msix-package/Assets/WillyLogo.scale-200.png"

        & magick "$iconPath" -resize 150x150 -background "#1a1a2e" -gravity center -extent 310x150 "msix-package/Assets/WillyWide.scale-100.png"
        & magick "$iconPath" -resize 188x188 -background "#1a1a2e" -gravity center -extent 388x188 "msix-package/Assets/WillyWide.scale-125.png"
        & magick "$iconPath" -resize 225x225 -background "#1a1a2e" -gravity center -extent 465x225 "msix-package/Assets/WillyWide.scale-150.png"
        & magick "$iconPath" -resize 300x300 -background "#1a1a2e" -gravity center -extent 620x300 "msix-package/Assets/WillyWide.scale-200.png"

        Write-Host "✅ All Microsoft Store assets created successfully"

    - name: Create MSIX Manifest
      working-directory: msix-package
      run: |
        @"
        <?xml version="1.0" encoding="utf-8"?>
        <Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10"
                 xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10"
                 xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities">

          <Identity
            Name="JasonBrianHall.WillyTheWormCPP"
            Publisher="CN=7A3CF65F-504C-42F2-BABD-6A0512A0A017"
            Version="${{ needs.build-windows.outputs.version }}"
            ProcessorArchitecture="${{ matrix.processor_architecture }}" />

          <Properties>
            <DisplayName>Willy the Worm</DisplayName>
            <PublisherDisplayName>Jason Brian Hall</PublisherDisplayName>
            <Description>A native C++ port of the classic Willy the Worm platform game.</Description>
            <Logo>Assets\StoreLogo.scale-100.png</Logo>
          </Properties>

          <Dependencies>
            <TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.17763.0" MaxVersionTested="10.0.26100.0" />
          </Dependencies>

          <Resources>
            <Resource Language="en-us" />
          </Resources>

          <Applications>
            <Application Id="WillyTheWorm" Executable="Files\willy.exe" EntryPoint="Windows.FullTrustApplication">
              <uap:VisualElements DisplayName="Willy the Worm"
                                  Description="A native C++ port of the classic Willy the Worm platform game."
                                  Square150x150Logo="Assets\WillyLogo.scale-100.png"
                                  Square44x44Logo="Assets\Willy44x44.scale-100.png"
                                  BackgroundColor="#1a1a2e">
                <uap:DefaultTile Wide310x150Logo="Assets\WillyWide.scale-100.png"
                                 ShortName="Willy the Worm">
                  <uap:ShowNameOnTiles>
                    <uap:ShowOn Tile="square150x150Logo"/>
                    <uap:ShowOn Tile="wide310x150Logo"/>
                  </uap:ShowNameOnTiles>
                </uap:DefaultTile>
                <uap:SplashScreen Image="Assets\WillyLogo.scale-100.png" />
              </uap:VisualElements>
            </Application>
          </Applications>

          <Capabilities>
            <rescap:Capability Name="runFullTrust" />
          </Capabilities>
        </Package>
        "@ | Out-File -FilePath "AppxManifest.xml" -Encoding UTF8

    - name: Build MSIX Package
      run: |
        $makeAppxPath = "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.0.22621.0\x64\makeappx.exe"

        if (-not (Test-Path $makeAppxPath)) {
          $sdkVersions = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\" |
            Where-Object { $_.Name -match "10\.0\.\d+\.\d+" } |
            Sort-Object Name -Descending
          foreach ($version in $sdkVersions) {
            $testPath = "${env:ProgramFiles(x86)}\Windows Kits\10\bin\$($version.Name)\x64\makeappx.exe"
            if (Test-Path $testPath) { $makeAppxPath = $testPath; break }
          }
        }

        if (-not (Test-Path $makeAppxPath)) {
          Write-Error "MakeAppx.exe not found."
          exit 1
        }

        Write-Host "Using MakeAppx at: $makeAppxPath"
        & "$makeAppxPath" pack /d "msix-package" /p "WillyTheWorm-CPP-${{ matrix.name }}.msix" /o

        if ($LASTEXITCODE -ne 0) { Write-Error "MSIX creation failed"; exit 1 }

        if (Test-Path "WillyTheWorm-CPP-${{ matrix.name }}.msix") {
          Write-Host "✅ MSIX created: WillyTheWorm-CPP-${{ matrix.name }}.msix ($((Get-Item "WillyTheWorm-CPP-${{ matrix.name }}.msix").Length) bytes)"
          Write-Host "Package is unsigned and ready for Microsoft Store submission"
        } else {
          Write-Error "❌ MSIX not created"; exit 1
        }

    - name: Upload MSIX
      uses: actions/upload-artifact@v4
      with:
        name: WillyTheWorm-CPP-${{ matrix.name }}.msix
        path: WillyTheWorm-CPP-${{ matrix.name }}.msix
        retention-days: 7

  create-release:
    needs: [create-source-release, build-windows-installer, build-windows, build-msi-windows, build-msix-windows, build-debug-standalone]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push'

    steps:
    - name: Download Python MSI Installer
      uses: actions/download-artifact@v4
      with:
        name: WillyTheWorm.msi
        path: release

    - name: Download Python Portable Artifact
      uses: actions/download-artifact@v4
      with:
        name: WillyTheWorm-Portable.zip
        path: release

    - name: Download Source Artifact
      uses: actions/download-artifact@v4
      with:
        name: source-package
        path: release

    - name: Download C++ MSI Installer
      uses: actions/download-artifact@v4
      with:
        name: WillyTheWorm-CPP.msi
        path: release

    - name: Download C++ MSIX Artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: WillyTheWorm-CPP-*.msix
        path: release
        merge-multiple: true

    - name: Download C++ Portable Artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: willy-cpp-build-*
        path: release
        merge-multiple: true

    - name: Download C++ Debug Artifact
      uses: actions/download-artifact@v4
      with:
        name: willy-cpp-debug-x64
        path: release

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release/WillyTheWorm.msi
          release/WillyTheWorm-Portable.zip
          release/willy-the-worm-source.zip
          release/WillyTheWorm-CPP.msi
          release/WillyTheWorm-CPP-x64.msix
          release/WillyTheWorm-CPP-arm64.msix
          release/WillyTheWorm-CPP-Portable-x64.zip
          release/WillyTheWorm-CPP-Portable-arm64.zip
          release/WillyTheWorm-CPP-Debug-x64.zip
        tag_name: ${{ github.ref == 'refs/heads/main' && format('v{0}', github.run_number) || format('dev-v{0}', github.run_number) }}
        name: ${{ github.ref == 'refs/heads/main' && format('Release v{0}', github.run_number) || format('Dev Build v{0}', github.run_number) }}
        draft: false
        prerelease: ${{ github.ref != 'refs/heads/main' }}
        make_latest: ${{ github.ref == 'refs/heads/main' }}
        body: |
          ## ${{ github.ref == 'refs/heads/main' && 'Stable Release' || 'Development Build' }}

          **Version:** ${{ env.PRODUCT_VERSION }}
          **Commit:** ${{ github.sha }}
          **Build:** #${{ github.run_number }}

          ### 🐛 Willy the Worm
          Classic platform game collection, available as both the original Python/pygame build and a native C++ (SDL2, MSVC) build.

          ### 📦 Python Edition (PyInstaller)
          - **WillyTheWorm.msi** — Windows installer with uninstall support
          - **WillyTheWorm-Portable.zip** — Portable version (no installation required)
          - **willy-the-worm-source.zip** — Source code archive

          Includes the game, level editor, and control panel, with all audio and level data bundled.

          ### 🚀 Native C++ Edition (SDL2 + MSVC)
          - **WillyTheWorm-CPP.msi** — Windows installer (x64 only)
          - **WillyTheWorm-CPP-x64.msix** / **WillyTheWorm-CPP-arm64.msix** — Unsigned packages ready for Microsoft Store submission
          - **WillyTheWorm-CPP-Portable-x64.zip** / **WillyTheWorm-CPP-Portable-arm64.zip** — Portable versions, no installation required
          - **WillyTheWorm-CPP-Debug-x64.zip** — Debug build with AddressSanitizer, for troubleshooting crashes

          ### 🏪 Microsoft Store Submission
          The MSIX package is **unsigned** and ready for submission via Partner Center. Before uploading:
          1. Update the `Identity Name` and `Publisher` in the manifest with your Partner Center values
          2. Upload the unsigned MSIX — Microsoft handles signing during certification

          ---
          *Built with ❤️ using GitHub Actions*
